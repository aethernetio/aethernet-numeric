# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: Test numerics
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  # Allows you to start workflow manually from the actions tab in the interface github.com
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    defaults:
      run:
        shell: ${{ matrix.config.shell }} {0}

    strategy:
      fail-fast: false

      matrix:
        config:
          # windows-latest (Server 2025) ships Visual Studio 2026 and the
          # "Visual Studio 18 2026" CMake generator as of June 2026.
          - {
              name: "Windows MSVC",
              os: windows-latest,
              shell: "powershell",
              cmake_args: '-G "Visual Studio 18 2026" -A x64',
              build_type: Release,
            }
          - {
              name: "Windows LLVM Clang",
              os: windows-latest,
              shell: "powershell",
              cmake_args: '-G "Visual Studio 18 2026" -A x64 -T ClangCL',
              build_type: Release,
            }
          - {
              name: "Windows MinGW",
              os: windows-latest,
              shell: "msys2",
              cmake_args: '-G Ninja',
              build_type: Release,
            }
          - {
              name: "Ubuntu GCC",
              os: ubuntu-latest,
              shell: "bash",
              cmake_args: '-G "Unix Makefiles" -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++',
              build_type: Release,
            }
          - {
              name: "Ubuntu LLVM Clang",
              os: ubuntu-latest,
              shell: "bash",
              cmake_args: '-G "Unix Makefiles" -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++',
              build_type: Release,
            }
          - {
              name: "macOS Apple-Clang",
              os: macos-latest,
              shell: "bash",
              cmake_args: '-G "Unix Makefiles" -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++',
              build_type: Release,
            }

    steps:
      - name: Set Windows MSVC environment
        if: ${{ (matrix.config.os == 'windows-latest' && matrix.config.shell == 'powershell') }}
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set MinGW environment
        if: ${{ (matrix.config.os == 'windows-latest' && matrix.config.shell == 'msys2') }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            git
            base-devel
          pacboy: >-
            cmake:p
            ninja:p
            gcc:p
          update: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: >
          cmake -B build-numerics
          ${{ matrix.config.cmake_args }}
          -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }}
          -DAE_BUILD_TESTS=ON
          -S ./

      - name: Build
        run: >
          cmake --build build-numerics
          --config ${{ matrix.config.build_type }} --parallel

      - name: Test
        run: >
          ctest --test-dir build-numerics
          --build-config ${{ matrix.config.build_type }}
          --output-on-failure --parallel

  cpplint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v1
      - run: pip install cpplint
      - run: cpplint --recursive ./ae-numeric
